<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>beat_02_problema</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width: 540px;
    height: 960px;
    background: transparent !important;
    overflow: hidden;
    font-family: 'Inter', sans-serif;
    color: #fff;
  }
  .scene { position:absolute; inset:0; }

  .wrap {
    position: absolute;
    top: 12%;
    left: 50%;
    transform: translateX(-50%);
    width: 94%;
    text-align: center;
  }

  .pre {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 22px;
    color: #ffffff;
    letter-spacing: 4px;
    text-transform: uppercase;
    opacity: 0;
    transform: translateY(8px);
    text-shadow: 0 2px 10px rgba(0,0,0,0.85);
    margin-bottom: 18px;
  }
  .pre .pill {
    display: inline-block;
    padding: 6px 14px;
    border-radius: 999px;
    background: rgba(13,13,13,0.7);
    border: 1px solid rgba(255,255,255,0.18);
    backdrop-filter: blur(8px);
  }

  .impact-row {
    position: relative;
    display: inline-block;
  }

  /* Yellow glow halo */
  .halo {
    position: absolute;
    inset: -30% -8%;
    background: radial-gradient(ellipse at center, rgba(250,197,28,0.55) 0%, rgba(250,197,28,0) 65%);
    filter: blur(20px);
    opacity: 0;
    z-index: 0;
    pointer-events: none;
  }

  .impact {
    position: relative;
    z-index: 1;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 84px;
    line-height: 0.95;
    letter-spacing: -2.5px;
    color: #FAC51C;
    text-shadow:
      0 0 22px rgba(250,197,28,0.55),
      0 6px 26px rgba(0,0,0,0.9);
    opacity: 0;
    transform: scale(0.55);
    display: inline-block;
  }
  .impact .line { display:block; }

  .sub {
    margin-top: 22px;
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 24px;
    color: #ffffff;
    opacity: 0;
    transform: translateY(10px);
    text-shadow: 0 2px 10px rgba(0,0,0,0.85);
  }
  .sub b { color: #FAC51C; font-weight: 700; }

  /* Bottom strip - factura tachada */
  .receipt {
    margin-top: 26px;
    display: inline-block;
    padding: 10px 22px;
    border-radius: 14px;
    background: rgba(13,13,13,0.7);
    border: 1px solid rgba(255,68,68,0.35);
    backdrop-filter: blur(8px);
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
    font-size: 18px;
    color: #ff7575;
    letter-spacing: 1px;
    opacity: 0;
    transform: translateY(10px);
    position: relative;
  }
  .receipt::after {
    content: "";
    position: absolute;
    left: 12%;
    right: 12%;
    top: 50%;
    height: 2px;
    background: #ff4444;
    transform-origin: left;
    transform: scaleX(0);
    box-shadow: 0 0 6px rgba(255,68,68,0.8);
  }
</style>
</head>
<body>
<div class="scene">
  <div class="wrap">
    <div class="pre" id="pre"><span class="pill">SIN LOS CONVENIOS CORRECTOS</span></div>
    <div class="impact-row">
      <div class="halo" id="halo"></div>
      <div class="impact" id="impact">
        <span class="line" id="l1">PAGANDO</span>
        <span class="line" id="l2">DE MÁS</span>
      </div>
    </div>
    <div class="sub" id="sub">en tu <b>póliza de contenedor</b></div>
    <div class="receipt" id="receipt" data-strike>$$$ &nbsp;&nbsp;EXTRA POR PÓLIZA &nbsp;&nbsp;$$$</div>
  </div>
</div>

<script>
const DURATION = 3.3;

function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }
function ease(t){ return 1 - Math.pow(1 - t, 3); }
function easeBack(t){ const c1=1.70158, c3=c1+1; return 1 + c3*Math.pow(t-1,3) + c1*Math.pow(t-1,2); }

function fadeUp(el, t, t0, dur, dy){
  const k = clamp((t - t0) / dur, 0, 1);
  const e = ease(k);
  el.style.opacity = e;
  el.style.transform = `translateY(${(1-e)*dy}px)`;
}

function render(t){
  // Pill
  fadeUp(document.getElementById('pre'), t, 0.05, 0.35, 8);

  // Impact pop with overshoot
  const impact = document.getElementById('impact');
  const halo = document.getElementById('halo');
  const k = clamp((t - 0.35) / 0.42, 0, 1);
  const e = easeBack(k);
  impact.style.opacity = clamp(k * 1.4, 0, 1);
  impact.style.transform = `scale(${0.55 + e*0.45})`;
  halo.style.opacity = clamp((t - 0.45) / 0.35, 0, 1) * 0.9;

  // Pulse halo throughout
  const pulse = 0.85 + Math.sin((t - 0.5) * 4.5) * 0.12;
  if (t > 0.5) halo.style.opacity = clamp((t - 0.45) / 0.35, 0, 1) * pulse;

  // Tiny shake on impact entry
  const shakeK = clamp((t - 0.65) / 0.35, 0, 1);
  const shakeMag = (1 - shakeK) * 4;
  const sx = Math.sin(t * 28) * shakeMag;
  const sy = Math.cos(t * 31) * shakeMag * 0.6;
  if (t > 0.5 && t < 1.05) {
    impact.style.transform = `translate(${sx}px, ${sy}px) scale(${0.55 + e*0.45})`;
  }

  // Sub
  fadeUp(document.getElementById('sub'), t, 1.15, 0.35, 10);

  // Receipt
  const receipt = document.getElementById('receipt');
  fadeUp(receipt, t, 1.55, 0.35, 10);
  // Strikethrough animates after entry
  const strikeK = clamp((t - 2.05) / 0.45, 0, 1);
  receipt.style.setProperty('--strike', strikeK);
  // Manually set strike scale via pseudo-element... we can't with style.setProperty alone in CSS pseudo.
  // Instead, inject inline style for an actual line via JS:
  if (!receipt.dataset.strikeReady){
    const strike = document.createElement('div');
    strike.id = 'strikeLine';
    Object.assign(strike.style, {
      position:'absolute', left:'12%', right:'12%', top:'50%',
      height:'2px', background:'#ff4444',
      transformOrigin:'left', transform:'scaleX(0)',
      boxShadow:'0 0 6px rgba(255,68,68,0.8)'
    });
    receipt.appendChild(strike);
    receipt.dataset.strikeReady = '1';
  }
  document.getElementById('strikeLine').style.transform = `scaleX(${ease(strikeK)})`;

  // Exit fade (last 0.3s)
  const out = clamp((t - (DURATION - 0.3)) / 0.3, 0, 1);
  document.querySelector('.wrap').style.opacity = (1 - out);
}

window.render = render;
window.DURATION = DURATION;

const __driven = new URLSearchParams(location.search).has('driven');
if (!window.__captureMode && !__driven) {
  const start = performance.now();
  function loop(){
    const t = (performance.now() - start) / 1000;
    if (t > DURATION) { render(0); setTimeout(()=>requestAnimationFrame(loop), 700); return; }
    render(t);
    requestAnimationFrame(loop);
  }
  document.fonts && document.fonts.ready.then(()=>requestAnimationFrame(loop));
  if (!document.fonts) requestAnimationFrame(loop);
}
</script>
</body>
</html>
