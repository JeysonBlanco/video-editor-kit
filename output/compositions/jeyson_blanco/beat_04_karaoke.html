<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>beat_04_karaoke</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width: 540px;
    height: 960px;
    background: transparent !important;
    overflow: hidden;
    font-family: 'Inter', sans-serif;
    color: #fff;
  }
  .scene { position:absolute; inset:0; }

  .caption {
    position: absolute;
    left: 50%;
    bottom: 8%;
    transform: translateX(-50%);
    width: 90%;
    text-align: center;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 8px 10px;
  }
  .word {
    font-family: 'Inter', sans-serif;
    font-weight: 800;
    font-size: 38px;
    line-height: 1.15;
    color: #ffffff;
    text-shadow:
      0 3px 0 rgba(0,0,0,0.55),
      0 4px 16px rgba(0,0,0,0.9);
    text-transform: uppercase;
    letter-spacing: -0.5px;
    transition: color 60ms linear, transform 80ms cubic-bezier(0.34,1.56,0.64,1), text-shadow 100ms ease;
    display: inline-block;
  }
  .word.active {
    color: #FAC51C;
    transform: scale(1.10);
    text-shadow:
      0 0 22px rgba(250,197,28,0.7),
      0 3px 0 rgba(0,0,0,0.55),
      0 4px 16px rgba(0,0,0,0.95);
  }
  .word.past { color: #ffffff; opacity: 0.85; }
  .word.future { color: rgba(255,255,255,0.45); }
</style>
</head>
<body>
<div class="scene">
  <div class="caption" id="cap"></div>
</div>

<script id="words-data" type="application/json">
[

<script>
const WORDS = JSON.parse(document.getElementById('words-data').textContent);
const DURATION = 9.722;

// Group words into phrases of up to ~3 words OR phrase break on punctuation
function makePhrases(words){
  const out = [];
  let cur = [];
  let charCount = 0;
  for (const w of words){
    cur.push(w);
    charCount += w.text.replace(/[.,]/g,'').length;
    const last = w.text;
    const endsPhrase = /[.,]/.test(last) || cur.length >= 3 || charCount >= 18;
    if (endsPhrase){
      out.push(cur);
      cur = [];
      charCount = 0;
    }
  }
  if (cur.length) out.push(cur);
  return out;
}

const PHRASES = makePhrases(WORDS);
// Attach start/end to each phrase
PHRASES.forEach(p => {
  p.start = p[0].start;
  p.end = p[p.length - 1].end;
});
// Extend each phrase visibility until the next phrase starts (avoid gaps)
for (let i = 0; i < PHRASES.length - 1; i++){
  PHRASES[i].visibleUntil = PHRASES[i+1].start;
}
PHRASES[PHRASES.length - 1].visibleUntil = DURATION;

const cap = document.getElementById('cap');
let currentPhraseIdx = -1;
let nodes = [];

function showPhrase(idx){
  cap.innerHTML = '';
  nodes = [];
  PHRASES[idx].forEach(w => {
    const span = document.createElement('span');
    span.className = 'word future';
    // Strip trailing punctuation from word display, keep clean
    span.textContent = w.text.replace(/[,.]$/,'');
    span._start = w.start;
    span._end = w.end;
    cap.appendChild(span);
    nodes.push(span);
  });
  currentPhraseIdx = idx;
}

function render(t){
  // Find current phrase
  let idx = -1;
  for (let i = PHRASES.length - 1; i >= 0; i--){
    if (t >= PHRASES[i].start - 0.05){ idx = i; break; }
  }
  if (idx < 0) {
    cap.innerHTML = '';
    nodes = [];
    currentPhraseIdx = -1;
    return;
  }
  // Hide if past visibleUntil
  if (t > PHRASES[idx].visibleUntil){
    cap.innerHTML = '';
    nodes = [];
    currentPhraseIdx = -1;
    return;
  }

  if (idx !== currentPhraseIdx) showPhrase(idx);

  // Update active/past/future state per word
  for (const node of nodes){
    if (t > node._end + 0.04) {
      node.className = 'word past';
    } else if (t >= node._start - 0.04 && t <= node._end + 0.04) {
      node.className = 'word active';
    } else {
      node.className = 'word future';
    }
  }

  // Fade in/out of phrase
  const phr = PHRASES[idx];
  const inK = Math.min(1, (t - phr.start + 0.12) / 0.15);
  const outK = Math.min(1, Math.max(0, (t - (phr.visibleUntil - 0.18)) / 0.18));
  cap.style.opacity = Math.max(0, Math.min(1, inK) - outK);
}

window.render = render;
window.DURATION = DURATION;

const __driven = new URLSearchParams(location.search).has('driven');
if (!window.__captureMode && !__driven) {
  const start = performance.now();
  function loop(){
    const t = (performance.now() - start) / 1000;
    if (t > DURATION + 0.5) { cap.innerHTML = ''; setTimeout(()=>{ currentPhraseIdx = -1; loopReset(); }, 700); return; }
    render(t);
    requestAnimationFrame(loop);
  }
  function loopReset(){
    const ns = performance.now();
    function l2(){
      const t = (performance.now() - ns) / 1000;
      if (t > DURATION + 0.5) { cap.innerHTML = ''; setTimeout(loopReset, 700); return; }
      render(t);
      requestAnimationFrame(l2);
    }
    currentPhraseIdx = -1;
    requestAnimationFrame(l2);
  }
  document.fonts && document.fonts.ready.then(()=>requestAnimationFrame(loop));
  if (!document.fonts) requestAnimationFrame(loop);
}
</script>
</body>
</html>
