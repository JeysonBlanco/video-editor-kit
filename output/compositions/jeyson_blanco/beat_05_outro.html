<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>beat_05_outro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@500;600;700&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width: 540px;
    height: 960px;
    background: transparent !important;
    overflow: hidden;
    font-family: 'Inter', sans-serif;
    color: #fff;
  }
  .scene { position:absolute; inset:0; }

  /* Vignette overlay para legibilidad */
  .veil {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at center, rgba(13,13,13,0.0) 35%, rgba(13,13,13,0.78) 100%),
      linear-gradient(to bottom, rgba(13,13,13,0.0) 30%, rgba(13,13,13,0.75) 70%, rgba(13,13,13,0.9) 100%);
    opacity: 0;
  }

  .wrap {
    position: absolute;
    left: 50%;
    bottom: 18%;
    transform: translateX(-50%);
    width: 92%;
    text-align: center;
  }

  .logo-wrap {
    opacity: 0;
    transform: translateY(14px) scale(0.85);
    margin-bottom: 18px;
  }
  .logo-wrap img {
    width: 100px;
    height: auto;
    object-fit: contain;
    filter: drop-shadow(0 0 18px rgba(250,197,28,0.5));
  }

  .brand {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 44px;
    letter-spacing: 2.5px;
    color: #ffffff;
    text-shadow: 0 4px 18px rgba(0,0,0,0.95);
    opacity: 0;
    transform: translateY(14px);
    margin-bottom: 10px;
  }
  .brand .yellow { color: #FAC51C; }

  .tagline {
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 18px;
    color: #B0B0B0;
    letter-spacing: 0.4px;
    line-height: 1.4;
    max-width: 86%;
    margin: 0 auto 22px;
    opacity: 0;
    transform: translateY(10px);
  }
  .tagline b { color: #ffffff; font-weight: 700; }

  .url-bar {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 12px 22px;
    border-radius: 999px;
    background: rgba(250,197,28,0.95);
    color: #0d0d0d;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
    font-size: 18px;
    letter-spacing: 1px;
    box-shadow: 0 10px 32px rgba(250,197,28,0.45);
    opacity: 0;
    transform: translateY(16px) scale(0.92);
  }
  .url-bar .arrow {
    width: 24px; height: 24px;
    border-radius: 50%;
    background: #0d0d0d;
    color: #FAC51C;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
  }
</style>
</head>

<script>
const DURATION = 3.1;
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
function ease(t){ return 1 - Math.pow(1 - t, 3); }
function easeBack(t){ const c1=1.70158, c3=c1+1; return 1 + c3*Math.pow(t-1,3) + c1*Math.pow(t-1,2); }

function fadeUp(el, t, t0, dur, dy){
  const k = clamp((t - t0) / dur, 0, 1);
  const e = ease(k);
  el.style.opacity = e;
  el.style.transform = `translateY(${(1-e)*dy}px)`;
}
function fadeUpScale(el, t, t0, dur, dy, sFrom){
  const k = clamp((t - t0) / dur, 0, 1);
  const e = easeBack(k);
  el.style.opacity = clamp(k*1.5, 0, 1);
  el.style.transform = `translateY(${(1-e)*dy}px) scale(${sFrom + e*(1 - sFrom)})`;
}

function render(t){
  // Veil fades in early
  document.getElementById('veil').style.opacity = clamp((t - 0.05) / 0.5, 0, 1);

  fadeUpScale(document.getElementById('logo'),  t, 0.20, 0.45, 14, 0.85);
  fadeUp     (document.getElementById('brand'), t, 0.55, 0.40, 14);
  fadeUp     (document.getElementById('tag'),   t, 0.90, 0.42, 10);
  fadeUpScale(document.getElementById('url'),   t, 1.30, 0.45, 16, 0.92);

  // Pulse del url-bar
  if (t > 1.85) {
    const p = 1 + Math.sin((t - 1.85) * 4.5) * 0.025;
    const el = document.getElementById('url');
    const cur = el.style.transform || '';
    if (!cur.includes('scale(')) el.style.transform = `translateY(0) scale(${p})`;
    else el.style.transform = cur.replace(/scale\([^)]+\)/, `scale(${p})`);
  }

  // No exit fade — el outro persiste hasta el final del video
}

window.render = render;
window.DURATION = DURATION;

const __driven = new URLSearchParams(location.search).has('driven');
if (!window.__captureMode && !__driven) {
  const start = performance.now();
  function loop(){
    const t = (performance.now() - start) / 1000;
    if (t > DURATION) { render(0); setTimeout(()=>requestAnimationFrame(loop), 800); return; }
    render(t);
    requestAnimationFrame(loop);
  }
  document.fonts && document.fonts.ready.then(()=>requestAnimationFrame(loop));
  if (!document.fonts) requestAnimationFrame(loop);
}
</script>
