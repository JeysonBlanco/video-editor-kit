<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>beat_01_intro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width: 540px;
    height: 960px;
    background: transparent !important;
    overflow: hidden;
    font-family: 'Inter', sans-serif;
    color: #fff;
  }
  .scene { position:absolute; inset:0; }

  /* Top container */
  .intro-wrap {
    position:absolute;
    top: 6%;
    left: 50%;
    transform: translateX(-50%);
    width: 92%;
    text-align: center;
    opacity: 0;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 8px 18px;
    border-radius: 999px;
    background: rgba(13,13,13,0.65);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(250,197,28,0.35);
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 16px;
    letter-spacing: 1.6px;
    color: #FAC51C;
    text-transform: uppercase;
    margin-bottom: 14px;
    opacity: 0;
    transform: translateY(10px);
  }
  .badge .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #FAC51C;
    box-shadow: 0 0 12px #FAC51C;
  }

  .title {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 56px;
    line-height: 1.05;
    letter-spacing: -1.2px;
    text-shadow: 0 6px 24px rgba(0,0,0,0.85);
  }
  .title .line { display:block; }
  .word {
    display: inline-block;
    opacity: 0;
    transform: translateY(18px);
  }
  .word.accent {
    color: #FAC51C;
    position: relative;
  }
  .underline {
    position: absolute;
    left: 0;
    bottom: -4px;
    height: 5px;
    width: 0%;
    background: linear-gradient(90deg, #FAC51C 0%, rgba(250,197,28,0.4) 100%);
    border-radius: 3px;
    box-shadow: 0 0 14px rgba(250,197,28,0.8);
  }
</style>
</head>
<body>
<div class="scene">
  <div class="intro-wrap" id="wrap">
    <div class="badge" id="badge"><span class="dot"></span>IMPORTACIÓN CHINA</div>
    <div class="title">
      <span class="line">
        <span class="word" id="w1">¿IMPORTAS</span>
      </span>
      <span class="line">
        <span class="word" id="w2">DESDE</span>
        <span class="word accent" id="w3">CHINA?<span class="underline" id="ul"></span></span>
      </span>
    </div>
  </div>
</div>

<script>
const DURATION = 4.5;

function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }
function ease(t){ return 1 - Math.pow(1 - t, 3); }              // cubic out
function easeBack(t){ const c1=1.70158, c3=c1+1; return 1 + c3*Math.pow(t-1,3) + c1*Math.pow(t-1,2); }
function fadeUp(el, t, t0, dur, dy){
  const k = clamp((t - t0) / dur, 0, 1);
  const e = ease(k);
  el.style.opacity = e;
  el.style.transform = `translateY(${(1-e)*dy}px)`;
}

function render(t){
  const wrap = document.getElementById('wrap');
  // Whole wrap fades in t=0.05
  wrap.style.opacity = clamp((t - 0.05) / 0.25, 0, 1);

  // Badge
  fadeUp(document.getElementById('badge'), t, 0.10, 0.35, 12);

  // Words staggered
  fadeUp(document.getElementById('w1'), t, 0.30, 0.38, 22);
  fadeUp(document.getElementById('w2'), t, 0.55, 0.38, 22);
  fadeUp(document.getElementById('w3'), t, 0.80, 0.38, 22);

  // Underline grows after CHINA appears
  const ulK = clamp((t - 1.15) / 0.55, 0, 1);
  document.getElementById('ul').style.width = `${easeBack(ulK)*100}%`;

  // Exit fade
  const out = clamp((t - 4.10) / 0.35, 0, 1);
  wrap.style.opacity = (1 - out) * clamp((t - 0.05) / 0.25, 0, 1);
}

window.render = render;
window.DURATION = DURATION;

// Live preview when not in capture mode and not externally driven
const __driven = new URLSearchParams(location.search).has('driven');
if (!window.__captureMode && !__driven) {
  const start = performance.now();
  function loop(){
    const t = (performance.now() - start) / 1000;
    if (t > DURATION) { render(0); setTimeout(()=>{ requestAnimationFrame(loop); }, 600); return; }
    render(t);
    requestAnimationFrame(loop);
  }
  // start anim once fonts ready
  document.fonts && document.fonts.ready.then(()=>requestAnimationFrame(loop));
  if (!document.fonts) requestAnimationFrame(loop);
}
</script>
</body>
</html>
