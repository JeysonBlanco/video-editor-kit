<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>cta_reinforce</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@500;600;700&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width: 540px;
    height: 960px;
    background: transparent !important;
    overflow: hidden;
    font-family: 'Inter', sans-serif;
    color: #fff;
  }
  .scene { position: absolute; inset: 0; }

  /* Chip de valor-prop arriba */
  .chip-row {
    position: absolute;
    top: 8%;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    justify-content: center;
    width: 90%;
    height: 50px;
  }
  .chip {
    padding: 9px 16px;
    border-radius: 999px;
    background: rgba(34, 211, 238, 0.20);
    border: 1.5px solid rgba(34, 211, 238, 0.6);
    backdrop-filter: blur(10px);
    font-family: 'Inter', sans-serif;
    font-weight: 800;
    font-size: 13px;
    letter-spacing: 1.5px;
    color: #67e8f9;
    text-transform: uppercase;
    white-space: nowrap;
    opacity: 0;
    transform: translateY(-8px);
    position: absolute;
    box-shadow: 0 8px 22px rgba(34,211,238,0.25);
  }
  .chip .dot {
    display: inline-block;
    width: 7px; height: 7px; border-radius: 50%;
    background: #22d3ee;
    box-shadow: 0 0 12px #22d3ee;
    margin-right: 8px;
    vertical-align: middle;
  }

  /* STICKER que CUBRE el botón quemado "AGENDÁ TU DEMO GRATIS"
     y arregla la contradicción con el speech "sin demo, sin vendedor".
     Coords ajustadas al render 9:16 (botón a y≈518-548) */
  .cta-fix {
    position: absolute;
    top: 510px;
    left: 50%;
    transform: translateX(-50%) translateY(8px) scale(0.95);
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 13px 24px;
    border-radius: 999px;
    background: linear-gradient(135deg, #22d3ee 0%, #06b6d4 100%);
    color: #052e36;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 18px;
    letter-spacing: 1.4px;
    box-shadow:
      0 0 0 6px rgba(34,211,238,0.18),
      0 12px 36px rgba(34,211,238,0.55);
    opacity: 0;
    white-space: nowrap;
  }
  .cta-fix .lightning {
    width: 22px; height: 22px;
    border-radius: 50%;
    background: #052e36;
    color: #22d3ee;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 13px;
  }

  /* Sub-mensaje para reforzar */
  .submsg {
    position: absolute;
    top: 568px;
    left: 50%;
    transform: translateX(-50%) translateY(6px);
    width: 88%;
    text-align: center;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 12px;
    letter-spacing: 1.8px;
    color: rgba(255,255,255,0.85);
    text-transform: uppercase;
    text-shadow: 0 2px 8px rgba(0,0,0,0.9);
    opacity: 0;
  }
  .submsg b { color: #67e8f9; }
</style>
</head>
<body>
<div class="scene">
  <div class="chip-row">
    <div class="chip" data-i="0"><span class="dot"></span>GPS SATELITAL EN VIVO</div>
    <div class="chip" data-i="1"><span class="dot"></span>ETAs QUE SE ACTUALIZAN SOLAS</div>
    <div class="chip" data-i="2"><span class="dot"></span>ALERTAS POR WHATSAPP</div>
    <div class="chip" data-i="3"><span class="dot"></span>SIN VENDEDOR · SIN DEMO</div>
  </div>

  <div class="cta-fix" id="ctaFix">
    <span class="lightning">⚡</span>EMPIEZA GRATIS · 1 MIN
  </div>

  <div class="submsg" id="sub">
    Acceso instantáneo · <b>sin tarjeta</b> · <b>sin llamadas</b>
  </div>
</div>

<script>
const DURATION = 6.0;

function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
function ease(t){ return 1 - Math.pow(1 - t, 3); }
function easeBack(t){ const c1=1.70158, c3=c1+1; return 1 + c3*Math.pow(t-1,3) + c1*Math.pow(t-1,2); }

const CHIPS = Array.from(document.querySelectorAll('.chip'));
const CHIP_DUR = 1.2;
const CHIP_FADE = 0.22;
const CHIP_GAP = 0.05;
const CHIP_T0 = 0.25;

function chipState(t){
  for (let i = 0; i < CHIPS.length; i++){
    const t0 = CHIP_T0 + i * (CHIP_DUR + CHIP_GAP);
    const local = t - t0;
    let op = 0, dy = -8;
    if (local >= 0 && local <= CHIP_DUR){
      const inK = clamp(local / CHIP_FADE, 0, 1);
      const outK = clamp((local - (CHIP_DUR - CHIP_FADE)) / CHIP_FADE, 0, 1);
      op = ease(inK) * (1 - ease(outK));
      dy = (1 - inK) * -10;
    }
    CHIPS[i].style.opacity = op;
    CHIPS[i].style.transform = `translateY(${dy}px)`;
  }
}

function render(t){
  chipState(t);

  // CTA fix sticker (cubre el "AGENDÁ TU DEMO GRATIS")
  const cta = document.getElementById('ctaFix');
  const cK = clamp((t - 0.50) / 0.45, 0, 1);
  const cE = easeBack(cK);
  cta.style.opacity = clamp(cK*1.5, 0, 1);
  cta.style.transform = `translateX(-50%) translateY(${(1-cE)*8}px) scale(${0.95 + cE*0.07})`;

  // Pulso sutil en el CTA
  if (t > 1.4){
    const pulse = 1 + Math.sin((t - 1.4) * 4.8) * 0.025;
    cta.style.transform = `translateX(-50%) translateY(0) scale(${1.02 * pulse})`;
  }

  // Submsg
  const sub = document.getElementById('sub');
  const sK = clamp((t - 1.0) / 0.45, 0, 1);
  const sE = ease(sK);
  sub.style.opacity = sE;
  sub.style.transform = `translateX(-50%) translateY(${(1-sE)*6}px)`;
}

window.render = render;
window.DURATION = DURATION;

const __driven = new URLSearchParams(location.search).has('driven');
if (!window.__captureMode && !__driven) {
  const start = performance.now();
  function loop(){
    const t = (performance.now() - start) / 1000;
    if (t > DURATION) { render(0); setTimeout(()=>requestAnimationFrame(loop), 800); return; }
    render(t);
    requestAnimationFrame(loop);
  }
  document.fonts && document.fonts.ready.then(()=>requestAnimationFrame(loop));
  if (!document.fonts) requestAnimationFrame(loop);
}
</script>
</body>
</html>
