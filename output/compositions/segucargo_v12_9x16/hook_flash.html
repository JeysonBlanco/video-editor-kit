<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>hook_flash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width: 540px;
    height: 960px;
    background: transparent !important;
    overflow: hidden;
    font-family: 'Inter', sans-serif;
    color: #fff;
  }
  .scene { position: absolute; inset: 0; }

  /* Veil al inicio para forzar el foco en el hook */
  .veil {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.42);
    opacity: 0;
  }

  /* Notificación tipo iPhone arriba */
  .notif {
    position: absolute;
    top: 16%;
    left: 50%;
    transform: translateX(-50%) translateY(-30px) scale(0.9);
    width: 86%;
    padding: 12px 14px;
    border-radius: 18px;
    background: rgba(28, 28, 32, 0.92);
    border: 1px solid rgba(255,255,255,0.10);
    box-shadow: 0 12px 36px rgba(0,0,0,0.7);
    backdrop-filter: blur(20px);
    display: flex;
    align-items: center;
    gap: 12px;
    opacity: 0;
  }
  .notif .avatar {
    width: 40px; height: 40px;
    border-radius: 10px;
    background: linear-gradient(135deg, #ff4444, #ff8a8a);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Inter', sans-serif;
    font-weight: 800; font-size: 18px;
    color: #ffffff;
    flex-shrink: 0;
  }
  .notif .body { flex: 1; min-width: 0; }
  .notif .row1 {
    display: flex; align-items: center; justify-content: space-between;
    font-family: 'Inter', sans-serif;
    font-weight: 700; font-size: 13px; color: #ffffff;
    margin-bottom: 2px;
  }
  .notif .row1 .time {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; color: rgba(255,255,255,0.6); font-weight: 500;
  }
  .notif .row2 {
    font-family: 'Inter', sans-serif;
    font-weight: 500; font-size: 13px; line-height: 1.35;
    color: rgba(255,255,255,0.92);
  }
  .notif .row2 b { color: #ff8a8a; font-weight: 700; }

  /* Hora gigante */
  .time-big {
    position: absolute;
    top: 35%;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    text-align: center;
    opacity: 0;
  }
  .time-big .label {
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 3px;
    color: rgba(255,255,255,0.55);
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .time-big .clock {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 86px;
    color: #ffffff;
    text-shadow: 0 4px 22px rgba(0,0,0,0.85);
    letter-spacing: -2px;
    line-height: 1;
  }
  .time-big .clock .colon {
    color: #ff8a8a;
    animation: blink 0.9s steps(2) infinite;
  }
  @keyframes blink {
    0%, 50% { opacity: 1; }
    50.01%, 100% { opacity: 0.2; }
  }

  /* Pregunta del gerente — flota abajo */
  .question {
    position: absolute;
    bottom: 22%;
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    width: 86%;
    text-align: center;
    font-family: 'Inter', sans-serif;
    font-weight: 800;
    font-size: 26px;
    line-height: 1.18;
    color: #ffffff;
    text-shadow: 0 4px 18px rgba(0,0,0,0.95);
    letter-spacing: -0.3px;
    opacity: 0;
    text-transform: uppercase;
  }
  .question b { color: #ff8a8a; }
</style>
</head>
<body>
<div class="scene">
  <div class="veil" id="veil"></div>

  <div class="time-big" id="big">
    <div class="label">— LUNES, 07:00 AM —</div>
    <div class="clock">07<span class="colon">:</span>00</div>
  </div>

  <div class="notif" id="notif">
    <div class="avatar">G</div>
    <div class="body">
      <div class="row1"><span>GERENTE GENERAL</span><span class="time">ahora</span></div>
      <div class="row2">¿Dónde está el <b>contenedor MV SEGU-001</b>?</div>
    </div>
  </div>

  <div class="question" id="q">…y no <b>sabes qué responder</b>.</div>
</div>

<script>
const DURATION = 2.5;
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
function ease(t){ return 1 - Math.pow(1 - t, 3); }
function easeBack(t){ const c1=1.70158, c3=c1+1; return 1 + c3*Math.pow(t-1,3) + c1*Math.pow(t-1,2); }

function render(t){
  // Veil oscurece el barco para que destaque el grafismo
  const veilK = clamp((t - 0.0) / 0.25, 0, 1);
  const veilOut = clamp((t - 2.0) / 0.5, 0, 1);
  document.getElementById('veil').style.opacity = veilK * 0.85 * (1 - veilOut);

  // Hora grande entra con popIn
  const bigK = clamp((t - 0.10) / 0.4, 0, 1);
  const bigE = easeBack(bigK);
  const big = document.getElementById('big');
  big.style.opacity = clamp(bigK*1.5, 0, 1);
  big.style.transform = `translateX(-50%) translateY(${(1-bigE)*20}px) scale(${0.85 + bigE*0.15})`;

  // Notif aparece justo después (slide-down)
  const nK = clamp((t - 0.55) / 0.35, 0, 1);
  const nE = ease(nK);
  const notif = document.getElementById('notif');
  notif.style.opacity = nE;
  notif.style.transform = `translateX(-50%) translateY(${(1-nE)*-30}px) scale(${0.9 + nE*0.1})`;

  // Pregunta de impacto al final
  const qK = clamp((t - 1.05) / 0.4, 0, 1);
  const qE = ease(qK);
  const q = document.getElementById('q');
  q.style.opacity = qE;
  q.style.transform = `translateX(-50%) translateY(${(1-qE)*10}px)`;

  // Exit fade ALL después de 2.0s
  const outK = clamp((t - 2.0) / 0.45, 0, 1);
  if (outK > 0){
    big.style.opacity   = parseFloat(big.style.opacity)   * (1 - outK);
    notif.style.opacity = parseFloat(notif.style.opacity) * (1 - outK);
    q.style.opacity     = parseFloat(q.style.opacity)     * (1 - outK);
  }
}

window.render = render;
window.DURATION = DURATION;

const __driven = new URLSearchParams(location.search).has('driven');
if (!window.__captureMode && !__driven) {
  const start = performance.now();
  function loop(){
    const t = (performance.now() - start) / 1000;
    if (t > DURATION) { render(0); setTimeout(()=>requestAnimationFrame(loop), 800); return; }
    render(t);
    requestAnimationFrame(loop);
  }
  document.fonts && document.fonts.ready.then(()=>requestAnimationFrame(loop));
  if (!document.fonts) requestAnimationFrame(loop);
}
</script>
</body>
</html>
