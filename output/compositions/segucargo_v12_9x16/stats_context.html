<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>stats_context</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@500;600;700&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width: 540px;
    height: 960px;
    background: transparent !important;
    overflow: hidden;
    font-family: 'Inter', sans-serif;
    color: #fff;
  }
  .scene { position:absolute; inset:0; }

  /* Etiqueta superior — aparece encima del 16:9 letterbox */
  .top-label {
    position: absolute;
    top: 8%;
    left: 50%;
    transform: translate(-50%, -10px);
    width: 88%;
    text-align: center;
    opacity: 0;
  }
  .top-label .eyebrow {
    display: inline-block;
    padding: 6px 14px;
    border-radius: 999px;
    background: rgba(255, 68, 68, 0.18);
    border: 1px solid rgba(255, 100, 100, 0.45);
    backdrop-filter: blur(8px);
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 2.2px;
    color: #ff8a8a;
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .top-label .title {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 26px;
    line-height: 1.12;
    color: #ffffff;
    text-shadow: 0 4px 16px rgba(0,0,0,0.95);
    letter-spacing: -0.3px;
  }
  .top-label .title b { color: #ff8a8a; }
  .top-label .source {
    margin-top: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: rgba(255,255,255,0.45);
    letter-spacing: 1.5px;
  }

  /* Etiqueta inferior — debajo del 16:9 letterbox */
  .bottom-label {
    position: absolute;
    bottom: 12%;
    left: 50%;
    transform: translate(-50%, 10px);
    width: 88%;
    text-align: center;
    opacity: 0;
  }
  .bottom-label .impact-bar {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 10px 20px;
    border-radius: 14px;
    background: rgba(13, 13, 13, 0.78);
    border: 1px solid rgba(255, 100, 100, 0.4);
    backdrop-filter: blur(10px);
    box-shadow: 0 12px 32px rgba(0,0,0,0.55);
  }
  .bottom-label .impact-bar .num {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 26px;
    color: #ff8a8a;
    text-shadow: 0 0 14px rgba(255, 100, 100, 0.55);
  }
  .bottom-label .impact-bar .txt {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 14px;
    color: #ffffff;
    letter-spacing: 0.3px;
    text-align: left;
    line-height: 1.25;
  }
</style>
</head>
<body>
<div class="scene">
  <div class="top-label" id="top">
    <div class="eyebrow">EL DATO QUE DUELE</div>
    <div class="title">De los importadores depende del<br><b>agente para saber dónde está su carga</b></div>
    <div class="source">FUENTE: BENCHMARK SEGUCARGO 2025</div>
  </div>

  <div class="bottom-label" id="bot">
    <div class="impact-bar">
      <div class="num">73%</div>
      <div class="txt">Decisiones paralizadas<br>por falta de datos en vivo</div>
    </div>
  </div>
</div>

<script>
const DURATION = 11.0; // 7.5s - 18.5s relative window (we expose render(t) with t in this window)
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
function ease(t){ return 1 - Math.pow(1 - t, 3); }

function fade(el, t, t0, dur, dyFrom){
  const k = clamp((t - t0) / dur, 0, 1);
  const e = ease(k);
  el.style.opacity = e;
  el.style.transform = `translate(-50%, ${(1-e)*dyFrom}px)`;
}

function render(t){
  // Top label aparece justo cuando el numero empieza a animarse (~t=0.5 in our local timeline, =8s in video)
  fade(document.getElementById('top'), t, 0.5,  0.55, -10);
  // Bottom impact-bar aparece cuando el 73% se asienta (~t=3.5 local = 11s video)
  fade(document.getElementById('bot'), t, 3.5,  0.5, 10);

  // Salida — ambos fade out al final del segmento
  const out = clamp((t - 9.5) / 0.5, 0, 1);
  if (out > 0) {
    const elTop = document.getElementById('top');
    const elBot = document.getElementById('bot');
    elTop.style.opacity = parseFloat(elTop.style.opacity || 1) * (1 - out);
    elBot.style.opacity = parseFloat(elBot.style.opacity || 1) * (1 - out);
  }
}

window.render = render;
window.DURATION = DURATION;

const __driven = new URLSearchParams(location.search).has('driven');
if (!window.__captureMode && !__driven) {
  const start = performance.now();
  function loop(){
    const t = (performance.now() - start) / 1000;
    if (t > DURATION) { render(0); setTimeout(()=>requestAnimationFrame(loop), 700); return; }
    render(t);
    requestAnimationFrame(loop);
  }
  document.fonts && document.fonts.ready.then(()=>requestAnimationFrame(loop));
  if (!document.fonts) requestAnimationFrame(loop);
}
</script>
</body>
</html>
