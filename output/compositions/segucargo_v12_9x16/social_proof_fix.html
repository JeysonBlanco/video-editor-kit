<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>social_proof_fix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width: 540px;
    height: 960px;
    background: transparent !important;
    overflow: hidden;
    font-family: 'Inter', sans-serif;
    color: #fff;
  }
  .scene { position: absolute; inset: 0; }

  /* Sticker que cubre el "+200" original con "+247" — coords aproximadas del burned-in */
  .sticker {
    position: absolute;
    top: 460px;    /* alinea con el +200 */
    left: 50%;
    transform: translateX(-50%) scale(0.9);
    text-align: center;
    opacity: 0;
    pointer-events: none;
  }
  .num {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 110px;
    letter-spacing: -3px;
    line-height: 0.95;
    background: linear-gradient(135deg, #22d3ee 0%, #67e8f9 35%, #fbbf24 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 36px rgba(34,211,238,0.45);
    filter: drop-shadow(0 4px 18px rgba(0,0,0,0.85));
  }
  .num .plus { font-size: 70px; vertical-align: 28px; }

  /* Mini badge debajo: "DATO ACTUALIZADO" */
  .badge {
    margin-top: 8px;
    display: inline-block;
    padding: 4px 10px;
    border-radius: 999px;
    background: rgba(34,211,238,0.20);
    border: 1px solid rgba(34,211,238,0.55);
    backdrop-filter: blur(8px);
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 10px;
    letter-spacing: 2px;
    color: #67e8f9;
    text-transform: uppercase;
  }
</style>
</head>
<body>
<div class="scene">
  <div class="sticker" id="st">
    <div class="num"><span class="plus">+</span>247</div>
    <div class="badge">·  Mayo 2026  ·</div>
  </div>
</div>

<script>
const DURATION = 6.0;
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
function ease(t){ return 1 - Math.pow(1 - t, 3); }
function easeBack(t){ const c1=1.70158, c3=c1+1; return 1 + c3*Math.pow(t-1,3) + c1*Math.pow(t-1,2); }

function render(t){
  const st = document.getElementById('st');
  const inK = clamp((t - 0.15) / 0.4, 0, 1);
  const outK = clamp((t - (DURATION - 0.6)) / 0.5, 0, 1);
  const inE = easeBack(inK);
  const outE = ease(outK);
  st.style.opacity = clamp(inK*1.4, 0, 1) * (1 - outE);
  const sc = 0.9 + inE * 0.10;
  st.style.transform = `translateX(-50%) scale(${sc})`;
}

window.render = render;
window.DURATION = DURATION;

const __driven = new URLSearchParams(location.search).has('driven');
if (!window.__captureMode && !__driven) {
  const start = performance.now();
  function loop(){
    const t = (performance.now() - start) / 1000;
    if (t > DURATION) { render(0); setTimeout(()=>requestAnimationFrame(loop), 800); return; }
    render(t);
    requestAnimationFrame(loop);
  }
  document.fonts && document.fonts.ready.then(()=>requestAnimationFrame(loop));
  if (!document.fonts) requestAnimationFrame(loop);
}
</script>
</body>
</html>
